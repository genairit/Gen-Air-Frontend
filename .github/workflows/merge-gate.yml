name: Merge gate

on:
  pull_request:
    branches: [test]
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  statuses: write

concurrency:
  group: frontend-release-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  e2e:
    name: End-to-end
    uses: genairit/Gen-Air-Automation/.github/workflows/e2e.yml@fa817eb3822bb53bc9b3941a7a38bf7e42da5ef1
    with:
      automation-ref: fa817eb3822bb53bc9b3941a7a38bf7e42da5ef1

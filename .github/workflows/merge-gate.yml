name: Merge gate

on:
  pull_request:
    branches: [test]
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  statuses: write

concurrency:
  group: frontend-release-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  e2e:
    name: End-to-end
    uses: genairit/Gen-Air-Automation/.github/workflows/e2e.yml@1940fae4a5cc1cca2ab7a88b9c54d0f5b6c25833
    with:
      automation-ref: 1940fae4a5cc1cca2ab7a88b9c54d0f5b6c25833

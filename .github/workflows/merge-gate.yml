name: Merge gate

on:
  pull_request:
    branches: [test]
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  statuses: write

concurrency:
  group: frontend-release-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  e2e:
    name: End-to-end
    uses: genairit/Gen-Air-Automation/.github/workflows/e2e.yml@29bba3a5bb4e1f2db49f70b93f6ca28cd39af968
    with:
      automation-ref: 29bba3a5bb4e1f2db49f70b93f6ca28cd39af968

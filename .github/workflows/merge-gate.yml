name: Merge gate

on:
  pull_request:
    branches: [test]
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  statuses: write

concurrency:
  group: frontend-release-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  e2e:
    name: End-to-end
    uses: genairit/Gen-Air-Automation/.github/workflows/e2e.yml@22352fce53b84f7e01aba99b8e646175a60a8a00
    with:
      automation-ref: 22352fce53b84f7e01aba99b8e646175a60a8a00

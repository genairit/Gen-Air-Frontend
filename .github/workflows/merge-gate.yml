name: Merge gate

on:
  pull_request:
    branches: [test]
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  statuses: write

concurrency:
  group: frontend-release-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  e2e:
    name: End-to-end
    uses: genairit/Gen-Air-Automation/.github/workflows/e2e.yml@1483d42a8464d3a4fe47f4759a86bcc14f2f4cfa
    with:
      automation-ref: 1483d42a8464d3a4fe47f4759a86bcc14f2f4cfa

name: Merge gate

on:
  pull_request:
    branches: [test]
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  statuses: write

concurrency:
  group: frontend-release-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  e2e:
    name: End-to-end
    uses: genairit/Gen-Air-Automation/.github/workflows/e2e.yml@71aa130a7ce0439f6fb943b5a73f6b9ebe1ed1a4
    with:
      automation-ref: 71aa130a7ce0439f6fb943b5a73f6b9ebe1ed1a4

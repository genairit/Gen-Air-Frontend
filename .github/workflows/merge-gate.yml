name: Merge gate

on:
  pull_request:
    branches: [test]
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  statuses: write

concurrency:
  group: frontend-release-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  e2e:
    name: End-to-end
    uses: genairit/Gen-Air-Automation/.github/workflows/e2e.yml@3eb8dd864f3efb0d3b0f0d5a6322a12433c97450
    with:
      automation-ref: 3eb8dd864f3efb0d3b0f0d5a6322a12433c97450

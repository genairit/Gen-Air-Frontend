name: Merge gate

on:
  pull_request:
    branches: [test]
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  statuses: write

concurrency:
  group: frontend-release-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  e2e:
    name: End-to-end
    uses: genairit/Gen-Air-Automation/.github/workflows/e2e.yml@839ea1d0a8421f60850cd9e0bfb10fd4afd2b5e1
    with:
      automation-ref: 839ea1d0a8421f60850cd9e0bfb10fd4afd2b5e1

name: Merge gate

on:
  pull_request:
    branches: [test]
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  statuses: write

concurrency:
  group: frontend-release-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  e2e:
    name: End-to-end
    uses: genairit/Gen-Air-Automation/.github/workflows/e2e.yml@a3990fe9be2f3bf44ce5c5c53f9d104cb3f6758b
    with:
      automation-ref: a3990fe9be2f3bf44ce5c5c53f9d104cb3f6758b

name: Merge gate

on:
  pull_request:
    branches: [test]
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  statuses: write

concurrency:
  group: frontend-release-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  e2e:
    name: End-to-end
    uses: genairit/Gen-Air-Automation/.github/workflows/e2e.yml@6781bb1a7fe1fa64b730a6924c7e7bb1bf5c3d50
    with:
      automation-ref: 6781bb1a7fe1fa64b730a6924c7e7bb1bf5c3d50

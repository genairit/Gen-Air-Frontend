name: Merge gate

on:
  pull_request:
    branches: [test]
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  statuses: write

concurrency:
  group: frontend-release-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  e2e:
    name: End-to-end
    uses: genairit/Gen-Air-Automation/.github/workflows/e2e.yml@b91b6ba5edd5a4ceeafc16a2d6b327e0ba6689c7
    with:
      automation-ref: b91b6ba5edd5a4ceeafc16a2d6b327e0ba6689c7

name: Merge gate

on:
  pull_request:
    branches: [test]
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  statuses: write

concurrency:
  group: frontend-release-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  e2e:
    name: End-to-end
    uses: genairit/Gen-Air-Automation/.github/workflows/e2e.yml@7d74e313ae2399cc7b3bc6fd05a8ecbef62a9c8f
    with:
      automation-ref: 7d74e313ae2399cc7b3bc6fd05a8ecbef62a9c8f

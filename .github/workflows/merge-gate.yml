name: Merge gate

on:
  pull_request:
    branches: [test]
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  statuses: write

concurrency:
  group: frontend-release-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  e2e:
    name: End-to-end
    uses: genairit/Gen-Air-Automation/.github/workflows/e2e.yml@fc51f4fa2a39875a27ad9dc66cea9bcd3c57aa6f
    with:
      automation-ref: fc51f4fa2a39875a27ad9dc66cea9bcd3c57aa6f

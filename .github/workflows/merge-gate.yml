name: Merge gate

on:
  pull_request:
    branches: [test]
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  statuses: write

concurrency:
  group: frontend-release-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  e2e:
    name: End-to-end
    uses: genairit/Gen-Air-Automation/.github/workflows/e2e.yml@2b0cb4bfaec38f7b35b5e45c34b7a16ccd80f98e
    with:
      automation-ref: 2b0cb4bfaec38f7b35b5e45c34b7a16ccd80f98e

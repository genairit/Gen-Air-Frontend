name: Merge gate

on:
  pull_request:
    branches: [test]
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  statuses: write

concurrency:
  group: frontend-release-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  e2e:
    name: End-to-end
    uses: genairit/Gen-Air-Automation/.github/workflows/e2e.yml@8d070b85ad7e2c3ddad9f43a22cf7c4f433d859e
    with:
      automation-ref: 8d070b85ad7e2c3ddad9f43a22cf7c4f433d859e

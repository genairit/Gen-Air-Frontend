name: Merge gate

on:
  pull_request:
    branches: [test]
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  statuses: write

concurrency:
  group: frontend-release-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  e2e:
    name: End-to-end
    uses: genairit/Gen-Air-Automation/.github/workflows/e2e.yml@3baf5a5b9766cb2b81c7bc66ed093bfd188b4480
    with:
      automation-ref: 3baf5a5b9766cb2b81c7bc66ed093bfd188b4480

name: Merge gate

on:
  pull_request:
    branches: [test, main]
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  statuses: write

concurrency:
  group: frontend-release-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  e2e:
    name: End-to-end
    uses: genairit/Gen-Air-Automation/.github/workflows/e2e.yml@1737b63cf1c1b42425e4b7f211f77e7390b3f8c1
    with:
      automation-ref: 1737b63cf1c1b42425e4b7f211f77e7390b3f8c1

name: Merge gate

on:
  pull_request:
    branches: [test]
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  statuses: write

concurrency:
  group: frontend-release-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  e2e:
    name: End-to-end
    uses: genairit/Gen-Air-Automation/.github/workflows/e2e.yml@2a3c36edf4a2a13b20f5be4a6a3035c2c2c59456
    with:
      automation-ref: 2a3c36edf4a2a13b20f5be4a6a3035c2c2c59456

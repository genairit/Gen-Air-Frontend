name: Merge gate

on:
  pull_request:
    branches: [test]
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  statuses: write

concurrency:
  group: frontend-release-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  e2e:
    name: End-to-end
    uses: genairit/Gen-Air-Automation/.github/workflows/e2e.yml@a8f5d7bbde2606825d0b6b4f87a5f49c3787e3b2
    with:
      automation-ref: a8f5d7bbde2606825d0b6b4f87a5f49c3787e3b2

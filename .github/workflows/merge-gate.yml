name: Merge gate

on:
  pull_request:
    branches: [test]
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  statuses: write

concurrency:
  group: frontend-release-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  e2e:
    name: End-to-end
    uses: genairit/Gen-Air-Automation/.github/workflows/e2e.yml@4c4ab876e44908e68ccb0be4a4d3c4f388f00b40
    with:
      automation-ref: 4c4ab876e44908e68ccb0be4a4d3c4f388f00b40

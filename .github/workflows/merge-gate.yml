name: Merge gate

on:
  pull_request:
    branches: [test]
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  statuses: write

concurrency:
  group: frontend-release-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  e2e:
    name: End-to-end
    uses: genairit/Gen-Air-Automation/.github/workflows/e2e.yml@9452c5bb6e6a85368d11a42fe2b3f3d1dcb7c72f
    with:
      automation-ref: 9452c5bb6e6a85368d11a42fe2b3f3d1dcb7c72f

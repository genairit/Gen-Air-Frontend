name: Merge gate

on:
  pull_request:
    branches: [test]
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  statuses: write

concurrency:
  group: frontend-release-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  e2e:
    name: End-to-end
    uses: genairit/Gen-Air-Automation/.github/workflows/e2e.yml@e4ed9e45a352c1f7d44ef5eafe0db5ad42cd7414
    with:
      automation-ref: e4ed9e45a352c1f7d44ef5eafe0db5ad42cd7414

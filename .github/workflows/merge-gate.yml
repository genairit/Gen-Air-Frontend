name: Merge gate

on:
  pull_request:
    branches: [test]
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  statuses: write

concurrency:
  group: frontend-release-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  e2e:
    name: End-to-end
    uses: genairit/Gen-Air-Automation/.github/workflows/e2e.yml@bc1684fe9f9d90e457c4a764b3c0e4d8cd84b681
    with:
      automation-ref: bc1684fe9f9d90e457c4a764b3c0e4d8cd84b681

name: Merge gate

on:
  pull_request:
    branches: [test]
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  statuses: write

concurrency:
  group: frontend-release-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  e2e:
    name: End-to-end
    uses: genairit/Gen-Air-Automation/.github/workflows/e2e.yml@078a99af94f23a4ba7fa8ec7f059794b46a5c4f5
    with:
      automation-ref: 078a99af94f23a4ba7fa8ec7f059794b46a5c4f5

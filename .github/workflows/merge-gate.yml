name: Merge gate

on:
  pull_request:
    branches: [test]
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  statuses: write

concurrency:
  group: frontend-release-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  e2e:
    name: End-to-end
    uses: genairit/Gen-Air-Automation/.github/workflows/e2e.yml@6d70d60d48ec529ee5ebc99ebaa14dea4130d01b
    with:
      automation-ref: 6d70d60d48ec529ee5ebc99ebaa14dea4130d01b

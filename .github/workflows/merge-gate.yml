name: Merge gate

on:
  pull_request:
    branches: [test]
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  statuses: write

concurrency:
  group: frontend-release-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  e2e:
    name: End-to-end
    uses: genairit/Gen-Air-Automation/.github/workflows/e2e.yml@2a66c8b82d39cc1eb59a8a4135050ddb7e9a9507
    with:
      automation-ref: 2a66c8b82d39cc1eb59a8a4135050ddb7e9a9507

name: Merge gate

on:
  pull_request:
    branches: [test]
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  statuses: write

concurrency:
  group: frontend-release-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  e2e:
    name: End-to-end
    uses: genairit/Gen-Air-Automation/.github/workflows/e2e.yml@9c723a97596cef00c5fd34ca1a9c10b1f0a4808c
    with:
      automation-ref: 9c723a97596cef00c5fd34ca1a9c10b1f0a4808c

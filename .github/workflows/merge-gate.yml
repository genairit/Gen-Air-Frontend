name: Merge gate

on:
  pull_request:
    branches: [test]
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  statuses: write

concurrency:
  group: frontend-release-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  e2e:
    name: End-to-end
    uses: genairit/Gen-Air-Automation/.github/workflows/e2e.yml@dfb5c78d1d1ebc8941f0f3f3a85f44a7bd86bdbb
    with:
      automation-ref: dfb5c78d1d1ebc8941f0f3f3a85f44a7bd86bdbb

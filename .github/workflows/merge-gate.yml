name: Merge gate

on:
  pull_request:
    branches: [test, main]
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  statuses: write

concurrency:
  group: frontend-release-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  e2e:
    name: End-to-end
    uses: genairit/Gen-Air-Automation/.github/workflows/e2e.yml@b29ae222ff4ebc582fcfc797bca5cb6f4ab587a3
    with:
      automation-ref: b29ae222ff4ebc582fcfc797bca5cb6f4ab587a3

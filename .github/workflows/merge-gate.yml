name: Merge gate

on:
  pull_request:
    branches: [test, main]
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  statuses: write

concurrency:
  group: frontend-release-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  e2e:
    name: End-to-end
    uses: genairit/Gen-Air-Automation/.github/workflows/e2e.yml@66207c0abf3b1edd2b464fbbbb8e527467c5f2ab
    with:
      automation-ref: 66207c0abf3b1edd2b464fbbbb8e527467c5f2ab

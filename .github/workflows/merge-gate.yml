name: Merge gate

on:
  pull_request:
    branches: [test]
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  statuses: write

concurrency:
  group: frontend-release-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  e2e:
    name: End-to-end
    uses: genairit/Gen-Air-Automation/.github/workflows/e2e.yml@6daed7d494e0fbf46a6b3bf320322c0f1f97ed60
    with:
      automation-ref: 6daed7d494e0fbf46a6b3bf320322c0f1f97ed60

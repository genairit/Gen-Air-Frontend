name: Merge gate

on:
  pull_request:
    branches: [test]
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  statuses: write

concurrency:
  group: frontend-release-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  e2e:
    name: End-to-end
    uses: genairit/Gen-Air-Automation/.github/workflows/e2e.yml@7c8a5b52ee8d7523f7c8afd9d6dc73b45f89481d
    with:
      automation-ref: 7c8a5b52ee8d7523f7c8afd9d6dc73b45f89481d

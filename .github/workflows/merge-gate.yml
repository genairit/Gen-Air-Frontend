name: Merge gate

on:
  pull_request:
    branches: [test]
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  statuses: write

concurrency:
  group: frontend-release-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  e2e:
    name: End-to-end
    uses: genairit/Gen-Air-Automation/.github/workflows/e2e.yml@5e30d830f39a7b25ec236028da3f31bc692b8644
    with:
      automation-ref: 5e30d830f39a7b25ec236028da3f31bc692b8644
